schema_version: 1

context:
  name: upstash-ratelimit
  version: "1.2.0"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/upstash_ratelimit-${{ version }}.tar.gz
  sha256: c29c128787ddcca7715bb2fccdc9674387e0ca6f7d4bc8e1dcd71d775abed8fb

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - poetry-core
    - pip
  run:
    - python >=${{ python_min }},<4.0.0
    - upstash-redis >=1.0.0,<2.0.0

tests:
  - python:
      imports:
        - upstash_ratelimit
      pip_check: true
      python_version: ${{ python_min }}

about:
  summary: Serverless ratelimiting package from Upstash
  license: MIT
  license_file: LICENSE
  homepage: https://github.com/upstash/ratelimit-python

extra:
  recipe-maintainers:
    - jan-janssen
